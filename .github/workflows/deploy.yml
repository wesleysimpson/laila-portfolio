name: Deploy to GitHub Pages

# Builds the optimized images and publishes the site whenever you push to main.
# You never have to run anything by hand — edit content, commit, push.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optimize images (generates images/optimized + manifest)
        run: npm run optimize

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html styles.css main.js CNAME .nojekyll images fonts _site/
          # Don't publish source or archived (unused/watermarked) originals
          rm -rf _site/images/raw _site/images/archive

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
